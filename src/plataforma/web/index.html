<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frota Mina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B4A8F'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EFM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/estatico/app.css">
</head>
<body>

<header class="topo">
  <div class="marca">
    <span class="logo" aria-hidden="true">FM</span>
    <span class="nome"><b>FROTA MINA</b><span id="sub">—</span></span>
  </div>
  <div class="busca">
    <input id="busca" type="search" placeholder="Pesquisar ativo, dispositivo, IP…"
           autocomplete="off" aria-label="Pesquisar">
  </div>
  <div class="indicadores" id="indicadores"></div>
</header>

<nav class="abas" aria-label="Seções">
  <button data-aba="ativo" aria-current="true">Visão Geral</button>
  <button data-aba="dispositivos">Dispositivos</button>
  <button data-aba="modulos">Coleta</button>
  <button data-aba="cobertura">Cobertura</button>
  <button data-aba="cadastro">Cadastro</button>
</nav>

<div class="app">
  <nav class="rail" aria-label="Árvore de ativos">
    <h3>Árvore de ativos</h3>
    <div id="arvore"></div>
  </nav>
  <main class="centro" id="centro"><p class="vazio">Carregando…</p></main>
</div>

<footer class="rodape-app">
  <span id="rodape">—</span>
  <span id="versao"></span>
</footer>

<input type="file" id="seletor" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<div id="modal"></div>
<script src="/estatico/app.js"></script>
</body>
</html>
