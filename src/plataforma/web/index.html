<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma TI + OT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317627A'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3ETO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<link rel="stylesheet" href="/estatico/app.css">
</head>
<body>

<header class="topo">
  <div class="marca">
    <span class="sigla" aria-hidden="true">TO</span>
    <span class="nomes"><b>Plataforma TI + OT</b><span id="sub">carregando…</span></span>
  </div>
  <div class="busca">
    <input id="busca" type="search" placeholder="Buscar ativo, dispositivo ou IP…"
           autocomplete="off" aria-label="Busca">
  </div>
  <div class="tiles" id="tiles"></div>
</header>

<nav class="secoes" aria-label="Seções">
  <button data-secao="ativos" aria-current="true">Ativos</button>
  <button data-secao="modulos">Módulos</button>
  <button data-secao="sinais">Cobertura</button>
  <button data-secao="achados">Cadastro</button>
</nav>

<div class="app">
  <nav class="rail" aria-label="Árvore de ativos">
    <div class="rotulo">Árvore de ativos</div>
    <div id="arvore"></div>
  </nav>
  <main class="centro" id="centro" tabindex="-1"><p class="aviso">Carregando…</p></main>
</div>

<footer class="rodape"><span id="rodape">—</span></footer>
<script src="/estatico/app.js"></script>
</body>
</html>
