<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMPS — Anglo American</title>
<link rel="icon" href="/estatico/anglo-marca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/estatico/app.css">
</head>
<body>

<header class="barra">
  <div class="identidade">
    <img class="logo" src="/estatico/anglo-american.png" alt="Anglo American" width="142" height="32">
    <span class="txt"><b>AMPS</b><span id="site">—</span></span>
  </div>

  <div class="pesquisa">
    <select id="escopo" aria-label="Escopo da busca">
      <option value="ativos">Ativos</option>
      <option value="dispositivos">Dispositivos</option>
    </select>
    <input id="busca" type="search" placeholder="Pesquisar ativo, dispositivo, IP…" autocomplete="off">
    <span class="lupa" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </span>
  </div>

  <nav class="menus" id="menus" aria-label="Indicadores"></nav>
</header>

<nav class="abas" aria-label="Seções">
  <button data-aba="ativo" aria-current="true">Visão Geral</button>
  <button data-aba="dispositivos">Dispositivos</button>
  <button data-aba="rede">Rede</button>
  <button data-aba="coleta">Coleta</button>
  <button data-aba="cobertura">Cobertura</button>
  <button data-aba="relatorios">Relatórios</button>
  <button data-aba="cadastro">Cadastro</button>
</nav>

<div class="app">
  <aside class="lateral">
    <h3>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        <path d="M6.5 10v4.5a2 2 0 0 0 2 2H14"/></svg>
      Árvore de Ativos
    </h3>
    <div class="filtro-arvore"><input id="filtro" type="search" placeholder="Filtrar árvore…"></div>
    <div class="arvore" id="arvore"></div>
    <div class="rapidos" id="rapidos"></div>
  </aside>
  <main class="centro" id="centro"><p class="nada">Carregando…</p></main>
</div>

<footer class="rodape">
  <span id="versao">—</span>
  <span id="atualizado"></span>
</footer>

<input type="file" id="seletor" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<div id="modal"></div>
<script src="/estatico/app.js"></script>
</body>
</html>
