[alembic]
script_location = migracoes
prepend_sys_path = src
path_separator = os
# A URL real vem de PLATAFORMA_BANCO; este valor só existe para o alembic não
# reclamar quando a variável estiver ausente.
sqlalchemy.url = postgresql+asyncpg://postgres@localhost:5432/plataforma

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
