[project]
name = "plataforma-inventario"
version = "0.1.0"
description = "Normalização, derivação e semeadura do inventário de ativos da mina"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "pysnmp>=7.1",
  "cryptography>=41",
]

[project.scripts]
semear-inventario = "inventario.cli:main"
semear-banco = "plataforma.cli:main"
criar-admin = "plataforma.admin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrações são geradas pelo Alembic. Reformatá-las à mão só produz ruído
# no diff e não torna ninguém mais capaz de lê-las.
extend-exclude = ["migracoes/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# No FastAPI, chamar Depends/Cookie/File/Form/Query no default É a forma da
# biblioteca declarar dependências. B008 aqui seria ruído, não achado.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Cookie", "fastapi.File",
  "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Header",
]
