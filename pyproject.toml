[project]
name = "plataforma-inventario"
version = "0.1.0"
description = "Normalização, derivação e semeadura do inventário de ativos da mina"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
semear-inventario = "inventario.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
